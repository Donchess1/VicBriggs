<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One-time setup | Vicbriggs</title><link rel="stylesheet" href="/assets/css/admin.css"><main><section class="panel" style="max-width:520px;margin:4vh auto"><h1>One-time administrator setup</h1><p>Use only after setting CMS_BOOTSTRAP_TOKEN as a Cloudflare secret. Remove that secret and this page immediately after setup.</p><form id="setup"><label>Admin email<input type="email" name="email" required></label><label>Strong password (14+ characters)<input type="password" name="password" minlength="14" required></label><label>One-time setup token<input type="password" name="setup_token" required></label><button>Create IT Admin</button><p id="message" role="status"></p></form></section></main><script>document.querySelector('#setup').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;const b=f.querySelector('button');b.disabled=true;const o=Object.fromEntries(new FormData(f));try{const r=await fetch('/api/admin/bootstrap',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(o)});const d=await r.json();document.querySelector('#message').textContent=d.message||d.error||'Unknown response';if(r.ok)f.reset()}catch(err){document.querySelector('#message').textContent=err.message}finally{b.disabled=false}};</script></html>
